########################################
# SmartDNS-rs Configuration — O5A device
#
# Device-adapted from /Users/emumba/dns-config/smartdns.conf (the tuned
# host-machine baseline). Deviations from that baseline, and why, are
# documented in plans/2026-07-24-smartdns-rs.md. In short: this instance is
# NOT the LAN-facing resolver (dnsmasq keeps 192.168.0.1:53 for that) — it
# listens on loopback only and dnsmasq forwards to it.
########################################

# Loopback only — port 53 stays dnsmasq's (LAN bridge). This is dnsmasq's
# upstream, not a direct LAN-facing resolver.
bind 127.0.0.1:5353

########################################
# Cache
########################################

# 8192 (raised 2026-10-07 from 4096). 4096 was not "comfortable, raise later"
# -- it was SATURATED. Every restart in the log reported exactly the cap:
#   ../../smartdns.log:  "DNS cache 4096 records loaded"  x4 (2026-10-06/07)
# i.e. the table was full and evicting, so names that were still in use came
# back as cold lookups. The old comment's condition ("raise later if ps shows
# headroom") is met: VmRSS was 11.5MB against MemAvailable 38MB, and the persist
# file costs ~125B/entry (~1MB at 8192). If RSS climbs past ~16MB, or a restart
# again reports a count equal to this cap, stop and re-measure before raising
# it further -- an exactly-at-cap count is the signal, not the RSS.
cache-size 8192
cache-persist yes
# tmpfs, not the shared/limited flash volume — lost on reboot, rebuilt cheaply.
cache-file /tmp/smartdns.cache

########################################
# Upstream connection reuse
########################################

# 600s (raised 2026-10-07 from the 120s default). The default dropped every
# upstream connection after 2 minutes idle, so the first lookup after any quiet
# spell paid a fresh TCP+TLS handshake to every pool member. Measured across a
# real 150s idle gap on scratch ports, fresh names (a genuine cold lookup):
#
#   domain                tcp-idle-time 120   tcp-idle-time 600
#   www.docker.com              704 ms               43 ms
#   www.kernel.org              160 ms               55 ms
#   www.postgresql.org           94 ms               69 ms
#   www.npmjs.com              5804 ms              990 ms  (WAN stall)
#   www.rust-lang.org           171 ms              176 ms
#
# 4 of 5, and the first post-idle lookup is the one that suffers. 600 is also
# deliberate: it matches rr-ttl-min, so a cached entry and the connection that
# produced it age out together. Do NOT raise it much further -- this WAN is
# behind carrier NAT (the device holds a 10.x address), so a connection kept
# past the operator's NAT idle timeout would be silently black-holed and cost a
# full client-side timeout instead of a cheap handshake. Anything beyond a 600s
# idle gap is UNTESTED; if first-lookup-after-long-idle ever starts failing,
# lower this before suspecting anything else.
tcp-idle-time 600

########################################
# IPv6 / AAAA
########################################

# force-AAAA-SOA yes (2026-10-07). This unit has NO IPv6 data path at all:
# /proc/net/if_inet6 holds only lo (::1) plus bridge0/eth0 link-local addresses;
# there is no global address and no default IPv6 route; ping6 to a resolved
# global AAAA returns "Network is unreachable". Verified live on this unit
# 2026-10-07, and consistent with mpdn being disabled for looping on IPv6
# connect with QCMAP pinned to IPFamily=4 (CLAUDE.md, plans/2026-08-01-*).
#
# Without this line smartdns still RACES every AAAA query upstream and returns
# global IPv6 addresses no client on this LAN can reach, so an IPv6-preferring
# client (Windows/macOS/Android happy-eyeballs) stalls on a failed connect
# before falling back to A -- exactly the "IPv6-preferred client hangs" symptom
# already recorded in plans/2026-08-12-x62-throughput-latency-diagnosis.md.
#
# In 0.13.1 this returns a default SOA in src/dns_mw_addr.rs:126 BEFORE any
# upstream query, so it removes that traffic rather than replacing it. Verified
# on a scratch port: AAAA -> NOERROR/SOA in ~0 ms, zero upstream queries, A
# unaffected. Caveat for whoever validates a future config: the setting does
# NOT appear in smartdns's startup summary, so gp-smartdns-validate.sh cannot
# assert it from a marker -- the assertion is behavioural, in gp-dns-health.sh.
#
# GATE -- REVERT THIS LINE IF IPv6 EVER COMES BACK. It is global: it would
# silently deny every client AAAA. gp-dns-health.sh probes for precisely that
# (an uncached AAAA returning a real address means IPv6 is back, and this line
# must be re-examined). The repo expects IPv6 could return -- see
# plans/2026-08-21-lan-http2-policy.md -- so this is a live condition, not a
# permanent one.
force-AAAA-SOA yes

# TTL floor (2026-07-26): many everyday domains publish very short upstream
# TTLs — measured live via dig @127.0.0.1:5353: wikipedia.org=2s,
# whatsapp.com=26s — so smartdns re-queries them constantly. rr-ttl-min pins
# every record as valid for >=600s regardless of the upstream's shorter TTL,
# cutting that churn (fewer upstream lookups on a cellular link). serve-expired
# below already makes post-expiry lookups instant, so this is a traffic
# reduction, not a latency fix. Kept modest on purpose: a high floor pins you
# to a possibly-stale/dead CDN edge IP (google/youtube rotate IPs each refresh),
# which on mobile is worse than a background re-query. Raise toward 3600 only if
# upstream query volume is still a concern and CDN pinning proves harmless.
rr-ttl-min 600

########################################
# Refresh cached entries before expiry
########################################

# prefetch-domain deliberately OFF (2026-07-24 latency testing): it
# proactively re-runs the full upstream race in the background for
# near-expiry entries, which is redundant with serve-expired below (that
# one instead serves the stale answer instantly and refreshes reactively,
# only for domains actually still being queried) — pure extra upstream
# traffic on a cellular link for no measured benefit here.
# prefetch-domain yes

# Serve a stale (expired) answer instantly while refreshing in the background,
# instead of blocking the client on a fresh lookup.
#
# serve-expired-ttl is 1h, NOT the 24h it used to be (2026-10-01). The long
# window was there to hide upstream outages because nothing detected them: with
# a day of grace, a dead pool stayed invisible and every client kept getting
# answers. That is no longer the right trade. gp-dns-health.sh now probes every
# 5 minutes with an uncached name and heals the pool within ~10 minutes, and
# anything longer is covered by dnsmasq's `strict-order` carrier tier, which
# advances on the explicit SERVFAIL smartdns emits once this window expires.
# What the 24h window actually bought was day-old CDN IPs surviving an outage —
# the same class of stale-edge answer that makes www.speedtest.net fail on a
# dead Cloudflare address (memory.md 2026-10-01) — and stale answers also
# bypass the per-domain speed-check ranking above. So: 1h covers a real upstream
# blip, and nothing beyond that is worth serving a wrong IP for.
serve-expired yes
serve-expired-ttl 3600
serve-expired-reply-ttl 30

########################################
# Logging — tmpfs + bounded, to avoid flash wear on a resource-tight device
########################################

log-level warn
log-file /tmp/smartdns.log
log-size 128k
log-num 2

########################################
# CDN edge selection -- PER-DOMAIN only (2026-10-01, revised)
########################################

# These two rules keep the Google-edge win that the 2026-10-01 work measured,
# without the LAN-wide damage that `response-mode fastest-ip` caused. Read this
# whole block before touching the directives: the previous global form is what
# took `www.speedtest.net` down on 2026-10-01 (see memory.md and
# plans/2026-10-01-speedtest-dead-edge-first-ping.md).
#
# WHY THE GLOBAL FORM WAS REMOVED (measured, same day, scratch ports):
# `speed-check-mode ping` + `response-mode fastest-ip` returns exactly ONE
# address for every name -- 12/12 single-IP answers, including for names whose
# upstreams hand over two (Cloudflare DoH, Google DoH and the carrier resolver
# all return both). With `rr-ttl-min 600` plus dnsmasq's 2000-entry front cache
# that single answer is then pinned for ~10 minutes. So one unhealthy edge IP
# becomes a 10-minute site outage with no fallback.
#
# Live case: `www.speedtest.net` -> `www.speedtest.net.cdn.cloudflare.net` has
# two A records in one block. `104.17.148.22` RSTs every TLS ClientHello (12/12,
# any SNI, any port, TLS 1.2 and 1.3) while the sibling `104.17.147.22`
# handshakes 12/12 -- and it passes ICMP and tcp:443, so no probe can rank it
# away; only the TLS handshake dies. `fastest-ip` handed it out 7 times in 12
# queries. Same shape for the 2026-10-01 `proton.me` finding: a single dead
# address must never be the only answer.
#
# WHAT REPLACES IT: probe only the domains that measurably benefit, and leave
# every other name with its full record set so clients can fall back. Measured
# 2026-10-01, interleaved same-run comparison, TCP connect from the device:
#
#   host                        full set (no probing)   per-domain rules
#   dl.google.com               192.178.134.x  350 ms    142.250.x   46-74 ms
#   redirector.googlevideo.com  192.178.177.x  353 ms    142.250.x   48-57 ms
#   www.google.com              142.251.x       49 ms    142.251.x   same
#   www.speedtest.net           2 A records              2 A records (fallback)
#   www.youtube.com             8 A records              8 A records
#   www.cloudflare.com          2 A records (17 ms)      2 A records (20 ms)
#   chat.whatsapp.com           unchanged                unchanged
#
# The far ranges are 192.178.158.0/23, 192.178.134.0/23 and 192.178.177.0/24
# (DoH upstreams answer with a ~300 ms Google edge); the near ones are
# 142.250.0.0/15. Rules cover `google.com` (dl.google.com included) and
# `googlevideo.com` (redirector.* included).
#
# `-speed-check-mode ping` per-domain implies the same ranking the old global
# `response-mode fastest-ip` did; `response-mode` is deliberately absent now
# (it is global-only, so any value re-collapses every domain to one address).
#
# Rejected alternatives, measured 2026-10-01 -- do not retry:
#   max-reply-ip-num 10 + response-mode first-ping  still 1 record per answer
#   response-mode first-ping                        still 1 record per answer
#   global speed-check + per-domain -no-speed-check  still 1 record (the global
#                                                    response-mode wins)
#   domain-rules /gstatic.com/ -speed-check-mode ping  no reliable win (1 of 3
#                                                    rounds near); www.gstatic.com
#                                                    and i.ytimg.com stay in the
#                                                    far ranges either way
#   edns-client-subnet <public-ip>/24               no effect, leaks the subnet
#   nameserver /domain/ip                           silently ignored by 0.13.1
#   address /domain/ip                              DOES work (see the
#                                                   aidcgroup.net pin below)
#
# GATE NOTE: `domain-rules` lines are NOT printed in smartdns's startup summary
# (not even at debug), so `gp-smartdns-validate.sh` cannot assert them the way it
# asserts "speed check mode: ICMP". What it asserts now is "speed check mode:
# OFF" -- i.e. the global form really is gone. The per-domain effect is verified
# behaviourally after deploy (`dig dl.google.com` must not be in 192.178.0.0/16,
# and its TCP connect ~50 ms); see scripts.md.
domain-rules /google.com/ -speed-check-mode ping
domain-rules /googlevideo.com/ -speed-check-mode ping

########################################
# Bootstrap DNS
########################################

server https://8.8.8.8/dns-query -bootstrap-dns -exclude-default-group
server https://9.9.9.9/dns-query -bootstrap-dns -exclude-default-group

########################################
# Upstream pool
########################################
#
# POOL WIDENED 2026-10-07 (4 -> 9 racing members, then 9 -> 8 the same day when
# Mullvad was removed for failing in-pool -- see the DO NOT RE-ADD note below).
# This REVERSES the 2026-10-01 trim recorded below, because that trim's premise
# no longer holds.
#
# Why the reversal is correct now -- measured 2026-10-07 on scratch loopback
# ports, interleaved so transient WAN drift cannot land on one side, counting
# only samples with status=NOERROR and >=1 answer:
#
#   The 2026-10-01 trim was taken under `speed-check-mode ping` +
#   `response-mode fastest-ip`, where a cold lookup WAITS for the slowest useful
#   response -- which is exactly where "a wide pool costs COLD latency" came
#   from. That regime is gone. This config sets NO global speed-check-mode, and
#   smartdns-rs 0.13.1 then FORCES response_strategy = FastestResponse when
#   speed_check_mode is None (src/dns_mw_ns.rs:214): the FIRST upstream to
#   return NOERROR wins and failures are simply demoted (src/dns_mw_ns.rs:423).
#   `response-mode` stays deliberately absent, and the global speed-check stays
#   off, because both re-break address selection -- see the CDN section above.
#
#   Under FastestResponse extra members do NOT sit on the critical path; each
#   one is another chance of a fast answer, so a wider pool should HELP. It does:
#
#     pool (all with server https://dns.google/dns-query), cold medians
#       4 members:  67 / 71 ms    mean 117 / 130 ms
#       7 members:  56 / 57 ms    mean 112 /  73 ms
#      10 members:  54 / 45 ms    mean  65 /  57 ms
#
#   (two domain sets, interleaved head-to-head; 4-vs-10 won on all four
#   numbers, 4-vs-7 on three of four.) WARM is unchanged -- it is cache-served
#   and never enters this race, which is why the user-visible path is unaffected.
#
# More members is queue depth, not a latency cost. The old "restore a member by
# un-commenting its line" rollback path is therefore closed: the previously
# dropped three are live again.
#
# Do NOT trim on /tmp/smartdns.log error counts -- those are dominated by
# transient cellular WAN blips hitting several upstreams within the same second
# (CLAUDE.md says so, and it is how a healthy server gets libelled). A wider
# pool makes that log noisier, not more actionable.
#
# PRIVACY TRADE-OFF -- read before adding more. Every cache miss is sent to
# every member, so this now discloses each cold query to eight operators instead
# of four. That is the deliberate price of the latency and failover gains. Note
# also that the filtering providers (Quad9, AdGuard) do not actually enforce
# blocks inside a mixed race: a non-NOERROR answer is skipped, so an unblocking
# member can answer first. Blocking is done by the `address /.../#` rules below,
# as it always was.
#
# FAILOVER is inherent here, not configured (verified 2026-10-07): with the
# Google member pointed at a blackhole (10.255.255.1) the pool still returned
# correct NOERROR answers for every test name via the other members. 0.13.1 has
# no priority/health mechanism and does not need one.

# Google -- DoH by hostname, and the only Google form that measured well.
# Replaced server-h3 on 2026-10-07. Cold medians, this unit:
#   h3://dns.google       159 ms isolated / 95 ms in the 4-pool (30 names, 2 rounds)
#   https://dns.google     82 ms isolated / 74 ms in the 4-pool
#   server-tls 8.8.8.8    197 / 131 ms      server-tls dns.google  151 / 124 ms
# QUIC rides UDP/443 (likely shaped here) and its crypto competes for this
# single-core CPU; the DoT forms need their own handshake and the IP-literal one
# also loses the SNI-based edge. A Google member stays in the pool because of
# its CDN mapping in Pakistan, which is why the per-domain rules above exist.
server https://dns.google/dns-query

# Cloudflare, both endpoint forms: hostname and IP literal, the latter needing
# no bootstrap step so it can answer sooner on a cold pool.
server https://cloudflare-dns.com/dns-query
server https://1.1.1.1/dns-query

# Quad9 (security filtering) and AdGuard unfiltered.
server https://dns.quad9.net/dns-query
server https://unfiltered.adguard-dns.com/dns-query

# Added 2026-10-07 with the widening -- the three the 2026-10-01 trim dropped.
# All three answered 3/3 when probed from this unit, and produce no ERRORs in
# the live pool.
server https://dns.nextdns.io
server https://sky.rethinkdns.com/
server https://doh.opendns.com/dns-query

# DO NOT RE-ADD Mullvad. It was added here on 2026-10-07 and removed the same
# day, after it spent 7 minutes emitting 27 identical
# "dns.mullvad.net/dns-query request timed out" ERRORs while the other eight
# members produced none -- and, more to the point, it is the one member that
# would be permanently red in this log, which is how a log stops being read.
#
# It fails IN THE POOL only, which is why a reachability probe cannot rule it
# out: `smartdns resolve --https @dns.mullvad.net example.com` succeeded 5/5 and
# `@194.242.2.2` also succeeded, while an otherwise-identical scratch instance
# with `server https://dns.mullvad.net/dns-query` as its sole upstream answered
# **0/5** cold queries -- and the IPv4-literal form `https://194.242.2.2/dns-query`
# failed 0/5 too, so it is not the AAAA record (`dns.mullvad.net` does publish
# `2a07:e340::2`, as do seven of the eight working members) and not the URL form.
# The resolve path and the pool's connection provider are simply not the same
# code path, so "it resolves" is not evidence that a member works here.
#
# Nothing is lost by its absence: the pool-width gain measured on this unit came
# from width, not from Mullvad -- the 7-member pool that excluded it also beat
# the 4-member pool (median 56/57 vs 67/71 ms), and a dead member contributes
# nothing to a FastestResponse race except failed connection attempts.

# Individual encrypted endpoints can time out during cellular WAN blips.
# dnsmasq is configured ahead of this resolver with strict-order and retains
# /etc/resolv.conf, so an explicit SERVFAIL falls through to carrier DNS
# without putting the carrier resolvers in this race or defeating per-query
# upstream selection and caching here.

########################################
# Per-domain overrides found via profiling (see /Users/emumba/dns-config/LEARNING.md)
########################################
#
# Alibaba's anti-bot/tracking edge under aidcgroup.net is called with a
# brand-new random subdomain on every page load, so ordinary caching can
# never help it. Verified across 6+ independently random subdomains that it
# always resolves to the same IP (true wildcard) — safe to pin directly.
address /aidcgroup.net/47.246.72.115
#
# Non-essential chat-widget/RUM init and telemetry beacon calls on daraz.pk
# tag pages — blocked outright (returns SOA/no data). Behavior trade-off
# (may disable Daraz's live-chat widget), not a pure perf fix; reverse by
# deleting these two lines if chat breaks.
address /umlazada.alibaba.com/#
address /epss.alibaba-inc.com/#

########################################
# Blocked outright
########################################
#
# Guardsquare (mobile app shielding / RASP vendor). Suffix rules, so these
# cover the apex plus every subdomain at any depth (xyz.guardsquare.com,
# a.b.guardsquare.com). Verified live on-device 2026-07-29: with only the
# .com line loaded, guardsquare.com and www.guardsquare.com both returned
# no answer while example.com resolved normally.
#
# NB: smartdns matches by domain-label suffix, not substring — there is no
# way to express "any name containing guardsquare" in an address rule.
# `address /guardsquare/#` and `address /*guardsquare*/#` were both tested
# on-device and matched nothing. A new guardsquare TLD needs its own line
# here; notguardsquare.com and foo-guardsquare-bar.net are not covered.
address /guardsquare.com/#
address /guardsquare.io/#
address /guardsquare.net/#
